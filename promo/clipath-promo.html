:root{
  --bg:#08080c; --surface:#12121b; --line:rgba(255,255,255,.1); --fg:#edeef4; --muted:#9093ab; --accent:#6e6bff; --ok:#34d399;
  --sans:"Inter","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);margin:0}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:16px;padding-inline:16px}
.stage{position:relative;height:min(calc(100vh - 150px),1280px);aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.5)}
.stage canvas{display:block;width:100%;height:100%}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,12,.35);border:0;color:var(--fg);cursor:pointer;font:700 17px var(--sans);letter-spacing:.02em}
.big span{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--accent);box-shadow:0 10px 40px rgba(110,107,255,.5)}
.big:focus-visible span{outline:3px solid var(--fg);outline-offset:3px}
.bar{width:min(100%,720px);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar button{font:600 13.5px var(--sans);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.bar button:hover{border-color:rgba(255,255,255,.25)}
.bar button:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar button.primary{background:var(--accent);border-color:transparent}
.bar button:disabled{opacity:.5;cursor:default}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
.read{font:500 12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{width:min(100%,720px);font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.hint kbd{font:500 11.5px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--fg)}
#status{color:var(--fg)}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" width="720" height="1280" aria-label="Clipath promo, 20 seconds"></canvas>
    <button class="big" id="bigPlay" type="button"><span>&#9654; Play with sound</span></button>
  </div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <button id="restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="20" step="0.0166667" value="0" aria-label="Position">
    <span class="read" id="read">00.00 s · beat 0.0</span>
    <button id="export" class="primary" type="button">Export MP4</button>
  </div>
  <p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> one frame · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> one beat. 1080×1920, 60 fps, 150 BPM. <span id="status"></span></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>

function spline(t,k){

}

function frame(){const t=now();if(playing&&t>=DUR){pause();pos=DUR}
  const t0=performance.now();render(Math.min(Math.max(t,0),DUR),playing?maxK:10);const ms=performance.now()-t0;
  if(playing){slow=ms>14?slow+1:Math.max(0,slow-1);if(slow>8&&maxK>2){maxK--;slow=0}}show(Math.max(0,Math.min(t,DUR)))}
(function loop(){frame();requestAnimationFrame(loop)})();
playBtn.onclick=()=>playing?pause():play();bigPlay.onclick=play;
document.getElementById('restart').onclick=()=>{pause();pos=0;play()};
scrub.oninput=()=>seek(+scrub.value);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '){e.preventDefault();playing?pause():play()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const d=(e.key==='ArrowRight'?1:-1)*(e.shiftKey?BEAT:1/FPS);seek(Math.round((pos+d)*FPS)/FPS)}});
ready.then(()=>frame());

/* ============================== export: WebCodecs H.264 + AAC into MP4 ============================== */
async function exportMP4(onProgress=()=>{}){
  await ready;
  const vc=document.createElement('canvas');vc.width=W;vc.height=H;const r=makeRenderer(vc);
  let vcodec='avc1.64002A';const vcfg={codec:vcodec,width:W,height:H,bitrate:24e6,framerate:FPS,avc:{format:'avc'}};
  if(!(await VideoEncoder.isConfigSupported(vcfg)).supported){vcfg.codec='avc1.4D002A';if(!(await VideoEncoder.isConfigSupported(vcfg)).supported)throw new Error('This browser cannot encode H.264 video.')}
  let acodec='aac',acfg={codec:'mp4a.40.2',sampleRate:music.sampleRate,numberOfChannels:2,bitrate:192000};
  if(!(await AudioEncoder.isConfigSupported(acfg)).supported){acodec='opus';acfg={codec:'opus',sampleRate:48000,numberOfChannels:2,bitrate:192000}}
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:{codec:acodec,numberOfChannels:2,sampleRate:acfg.sampleRate},fastStart:'in-memory'});
  let err=null;
  const ve=new VideoEncoder({output:(ch,m)=>muxer.addVideoChunk(ch,m),error:e=>err=e});ve.configure(vcfg);
  const ae=new AudioEncoder({output:(ch,m)=>muxer.addAudioChunk(ch,m),error:e=>err=e});ae.configure(acfg);
  const L=music.getChannelData(0),R=music.getChannelData(1),CH=1024;
  for(let i=0;i<music.length;i+=CH){const n=Math.min(CH,music.length-i),buf=new Float32Array(n*2);buf.set(L.subarray(i,i+n),0);buf.set(R.subarray(i,i+n),n);
    ae.encode(new AudioData({format:'f32-planar',sampleRate:music.sampleRate,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/music.sampleRate*1e6),data:buf}))}
  const N=DUR*FPS;
  for(let f=0;f<N;f++){if(err)throw err;r(f/FPS,16);const vf=new VideoFrame(vc,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(vf,{keyFrame:f%FPS===0});vf.close();
    if(ve.encodeQueueSize>6)await new Promise(res=>{const w=()=>ve.encodeQueueSize>2?setTimeout(w,1):res();w()});if(f%10===0){onProgress(f/N);await new Promise(res=>setTimeout(res,0))}}
  await ve.flush();await ae.flush();if(err)throw err;muxer.finalize();onProgress(1);
  return new Uint8Array(muxer.target.buffer);
}
exportBtn.onclick=async()=>{
  pause();exportBtn.disabled=true;
  try{
    const bytes=await exportMP4(p=>statusEl.textContent=`Rendering ${Math.round(p*100)}%…`);
    const name='clipath-promo-1080x1920.mp4';
    const dl=window.claude?.use?await window.claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:name,data:new Blob([bytes],{type:'video/mp4'})});statusEl.textContent='Saved.'}catch(e){statusEl.textContent=e&&e.code==='declined'?'Save cancelled.':'This view cannot save files.'}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));a.download=name;document.body.appendChild(a);a.click();a.remove();statusEl.textContent='Downloaded.'}
  }catch(e){statusEl.textContent='Export failed: '+(e&&e.message||e)+' Use a recent Chrome or Edge.'}
  exportBtn.disabled=false;
};
if(!('VideoEncoder' in window)){exportBtn.disabled=true;statusEl.textContent='Export needs Chrome or Edge.'}

/* ============================== review hooks (used to check the cut frame by frame) ============================== */
window.__review={
  ready,
  sheet:async(t0,t1,step,cols,cw)=>{await ready;const fc=document.createElement('canvas');fc.width=540;fc.height=960;const r=makeRenderer(fc);
    const n=Math.round((t1-t0)/step),rows=Math.ceil(n/cols),ch=cw*16/9,sh=document.createElement('canvas');sh.width=cols*cw;sh.height=rows*(ch+22);const s=sh.getContext('2d');s.fillStyle='#222';s.fillRect(0,0,sh.width,sh.height);
    for(let i=0;i<n;i++){const t=t0+i*step,k=r(t,16);const x=(i%cols)*cw,y=Math.floor(i/cols)*(ch+22);s.drawImage(fc,x,y+22,cw,ch);s.fillStyle='#fff';s.font='13px monospace';s.fillText(`${t.toFixed(2)}s b${(t/BEAT).toFixed(2)} k${k}`,x+3,y+15)}
    return sh.toDataURL('image/png')},
  frame:async(t,w=540)=>{await ready;const fc=document.createElement('canvas');fc.width=w;fc.height=w*16/9;makeRenderer(fc)(t,16);return fc.toDataURL('image/png')},
  exportMP4:async()=>{const b=await exportMP4(p=>window.__prog=p);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)},
  wav:async()=>{await ready;const L=music.getChannelData(0),R=music.getChannelData(1);let pk=0,rms=0;for(let i=0;i<L.length;i++){const v=Math.max(Math.abs(L[i]),Math.abs(R[i]));pk=Math.max(pk,v);rms+=L[i]*L[i]}return{peak:pk,rms:Math.sqrt(rms/L.length)}},
};
</script>
